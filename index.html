<!doctype html>
<html lang="zh-CN">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffd9ea">
<meta charset="utf-8">
<title>环游大亨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Noto+Sans+SC:wght@400;500;700;900&family=ZCOOL+KuaiLe&display=swap">
<style>
/* 布局：整屏是 3D 小岛，上面浮一层糖果色的界面：顶上玩家条，底下一个大按钮，弹窗是一张张圆角卡片。
   只有一种明亮的糖果外观，深色模式下也一样 */
:root{
  color-scheme:light;
  --ink:#3b2d45;
  --ink-soft:#7a6a86;
  --paper:#fffaf3;
  --line:rgba(59,45,69,.12);
  --pink:#ff6f9a;
  --pink-deep:#e2507e;
  --lemon:#ffd54f;
  --mint:#5fd4b0;
  --sky:#7fd0ef;
  --grape:#b9a5ff;
  --shadow:0 12px 34px rgba(120,60,110,.2),0 2px 6px rgba(120,60,110,.12);
  --font-title:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei",sans-serif;
  --font-body:"Noto Sans SC","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
  --font-num:"Baloo 2","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{overflow:hidden;color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;
  background:radial-gradient(120% 90% at 50% 0%,#ffeef7 0%,#ffd9ea 42%,#cfe9ff 100%);touch-action:manipulation}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #fff;box-shadow:0 0 0 6px var(--pink)}
.num{font-family:var(--font-num);font-weight:700;font-variant-numeric:tabular-nums}

#stage{position:fixed;inset:0}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
#loading{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:radial-gradient(120% 90% at 50% 0%,#ffeef7 0%,#ffd9ea 42%,#cfe9ff 100%);transition:opacity .8s ease;font-family:var(--font-title);color:var(--pink-deep)}
#loading.gone{opacity:0;pointer-events:none}
#loading .inner{display:flex;flex-direction:column;align-items:center;gap:14px;font-size:20px}
#loading .dice{width:54px;height:54px;border-radius:14px;background:#fff;box-shadow:0 10px 24px rgba(226,80,126,.25),inset 0 -4px 0 rgba(0,0,0,.06);display:grid;place-items:center;font-size:30px;animation:tumble 1.4s cubic-bezier(.3,.9,.4,1.1) infinite}
@keyframes tumble{0%{transform:rotate(0) translateY(0)}40%{transform:rotate(180deg) translateY(-18px)}70%{transform:rotate(360deg) translateY(0)}85%{transform:rotate(360deg) translateY(-6px)}100%{transform:rotate(360deg) translateY(0)}}

/* 糖果按钮 */
.btn{position:relative;border:0;border-radius:999px;padding:12px 22px;font-weight:900;font-size:16px;line-height:1.2;color:#fff;
  background:linear-gradient(180deg,#ff8fb2,var(--pink));box-shadow:inset 0 -4px 0 rgba(0,0,0,.12),inset 0 2px 0 rgba(255,255,255,.35),0 6px 16px rgba(255,111,154,.38);
  transition:transform .12s ease,filter .12s}
.btn:active:not(:disabled){transform:translateY(2px) scale(.98)}
.btn:disabled{filter:grayscale(.7) opacity(.55);cursor:default}
.btn.mint{background:linear-gradient(180deg,#86e6c6,var(--mint));box-shadow:inset 0 -4px 0 rgba(0,0,0,.1),inset 0 2px 0 rgba(255,255,255,.35),0 6px 16px rgba(95,212,176,.38)}
.btn.lemon{color:var(--ink);background:linear-gradient(180deg,#ffe58a,var(--lemon));box-shadow:inset 0 -4px 0 rgba(0,0,0,.08),inset 0 2px 0 rgba(255,255,255,.45),0 6px 16px rgba(255,200,60,.38)}
.btn.ghost{color:var(--ink);background:#fff;box-shadow:inset 0 0 0 2px var(--line),0 4px 10px rgba(120,60,110,.08)}
.btn.small{padding:8px 14px;font-size:14px}
.chip-btn{display:grid;place-items:center;width:48px;height:48px;border:0;border-radius:50%;background:rgba(255,255,255,.94);box-shadow:var(--shadow);font-size:20px;transition:transform .12s}
.chip-btn:active{transform:scale(.92)}
.chip-btn span{font-size:10px;font-weight:700;line-height:1;margin-top:-2px;color:var(--ink-soft)}

/* 头像：3D 小动物的快照 */
.av{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:var(--c,#eee);overflow:hidden;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.av img{width:118%;height:118%;object-fit:contain;transform:translateY(6%)}

/* 首页、大厅：一张大卡片浮在小岛上 */
.panel-wrap{position:fixed;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;padding:16px;padding-block:calc(16px + env(safe-area-inset-top,0px)) calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.panel{position:relative;width:min(430px,100%);max-height:100%;overflow:auto;background:rgba(255,250,243,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-radius:30px;padding:24px 22px 22px;box-shadow:var(--shadow),inset 0 0 0 1.5px rgba(255,255,255,.7);animation:pop .45s cubic-bezier(.2,.9,.3,1.2)}
.logo{margin:0;text-align:center;font-family:var(--font-title);font-weight:400;font-size:54px;line-height:1.1;letter-spacing:.06em;
  background:linear-gradient(180deg,#ff8fb2 0%,#ff5c8a 55%,#e2507e 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #fff) drop-shadow(0 7px 0 rgba(226,80,126,.22))}
.tagline{margin:8px 0 18px;text-align:center;color:var(--ink-soft);font-size:14px;text-wrap:balance}
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-soft)}
.field input,.field select{width:100%;padding:11px 14px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-size:16px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row > *{flex:1 1 auto}
.sep{height:0;margin:16px 0;border-top:2px dashed var(--line)}
.note{margin:8px 0 0;font-size:13px;color:var(--ink-soft);text-align:center}
.err{margin:8px 0 0;font-size:13px;color:var(--pink-deep);text-align:center;min-height:1.2em}
.panel h2{margin:0 0 4px;font-family:var(--font-title);font-weight:400;font-size:28px;text-align:center;color:var(--ink)}
.room-tag{display:block;margin:0 auto 10px;width:max-content;padding:2px 12px;border-radius:999px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--font-num);font-size:18px;letter-spacing:.14em}
.corner-btn{position:absolute;top:14px;right:14px;width:40px;height:40px;font-size:18px}

.chars{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.char{position:relative;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border:0;border-radius:18px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);text-align:center;transition:transform .15s,box-shadow .15s}
.char .face{display:grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--c);overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
.char .face img{width:120%;height:120%;object-fit:contain;transform:translateY(7%)}
.char b{font-family:var(--font-title);font-weight:400;font-size:16px}
.char i{font-style:normal;font-size:11px;font-weight:700;color:var(--ink-soft)}
.char small{font-size:11px;line-height:1.3;color:var(--ink-soft);text-wrap:balance}
.char[aria-pressed="true"]{box-shadow:inset 0 0 0 3px var(--c),0 8px 18px rgba(120,60,110,.18);transform:translateY(-3px)}
.char.taken{opacity:.45}
.char .who{position:absolute;top:6px;right:6px;padding:0 6px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;max-width:70%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.seats{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.seat{display:grid;grid-template-columns:38px minmax(0,1fr) auto;align-items:center;gap:10px;padding:7px 8px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.seat.empty{background:transparent;color:var(--ink-soft)}
.seat .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.tag{display:inline-block;margin-left:5px;padding:0 7px;border-radius:999px;font-size:11px;font-weight:700;vertical-align:2px;background:#f2ecf6;color:var(--ink-soft)}
.tag.pink{background:var(--pink);color:#fff}
.share{display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);margin-bottom:12px}
.share code{overflow-wrap:anywhere;font-family:var(--font-num);font-size:14px;user-select:all}

/* 对局界面 */
.hud-top{position:fixed;left:0;right:0;top:0;z-index:5;padding:10px 12px 0;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.players{display:flex;gap:6px;width:min(560px,100%);pointer-events:auto}
.pc{position:relative;flex:1 1 0;min-width:0;display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(120,60,110,.14);transition:transform .25s,box-shadow .25s}
.pc .av{width:32px;height:32px}
.pc .info{min-width:0;display:flex;flex-direction:column;line-height:1.1}
.pc .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;font-weight:700;color:var(--ink-soft)}
.pc .cash{font-family:var(--font-num);font-weight:800;font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}
.pc.cur{transform:translateY(3px) scale(1.05);box-shadow:0 0 0 3px var(--c),0 8px 18px rgba(120,60,110,.22)}
.pc.out{opacity:.4}
.pc .badge{position:absolute;top:-6px;right:-2px;padding:0 6px;border-radius:999px;background:var(--ink);color:#fff;font-size:10px;font-weight:700;line-height:16px}
.turn-pill{display:flex;align-items:center;gap:8px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(120,60,110,.14);font-weight:700;font-size:14px;pointer-events:auto;max-width:100%}
.turn-pill .rd{font-family:var(--font-num);font-size:13px;color:var(--ink-soft);white-space:nowrap}
.turn-pill .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 事件播报和骰子点数 */
.dice-pill{padding:4px 14px;border-radius:999px;background:var(--ink);color:#fff;font-family:var(--font-num);font-weight:800;font-size:17px;letter-spacing:.04em;box-shadow:0 6px 16px rgba(59,45,69,.25);opacity:0;transform:translateY(-8px);transition:opacity .25s,transform .25s}
.dice-pill.show{opacity:1;transform:none}
.event{display:flex;align-items:center;gap:8px;max-width:min(540px,100%);padding:7px 14px 7px 10px;border-radius:999px;background:rgba(255,255,255,.97);box-shadow:0 10px 26px rgba(120,60,110,.24),inset 0 0 0 2px rgba(255,255,255,.8);font-weight:700;font-size:15px;opacity:0;transform:translateY(-10px) scale(.96);transition:opacity .25s,transform .25s;pointer-events:none}
.event.show{opacity:1;transform:none}
.event .ico{font-size:20px;line-height:1}
.event .av.sm{width:30px;height:30px}
.event .tx{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.event .amt{flex:none;font-family:var(--font-num);font-weight:800;font-size:16px;padding:1px 9px;border-radius:999px;color:#fff;background:var(--ink)}
.event .amt.up{background:#3cb990}
.event .amt.down{background:var(--pink-deep)}
.event .pic{flex:none;width:46px;height:46px;object-fit:contain;margin:-10px -6px -10px 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.15))}
.pc .delta{position:absolute;left:50%;bottom:-13px;transform:translateX(-50%);padding:0 7px;border-radius:999px;font-family:var(--font-num);font-weight:800;font-size:12px;line-height:18px;color:#fff;background:#3cb990;box-shadow:0 3px 8px rgba(0,0,0,.15);white-space:nowrap;animation:deltaPop .3s cubic-bezier(.2,.9,.3,1.3)}
.pc .delta.down{background:var(--pink-deep)}
@keyframes deltaPop{from{transform:translateX(-50%) scale(.4);opacity:0}}
.log{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;max-height:50vh;overflow:auto}
.log li{padding:5px 10px;border-radius:10px;background:#fff;box-shadow:inset 0 0 0 1.5px var(--line)}
.log li:first-child{background:#fff3f7;font-weight:700}
.hud-bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;padding:0 14px 14px;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:10px;pointer-events:none}
.msg{max-width:min(420px,100%);padding:8px 16px;border-radius:18px;background:rgba(255,255,255,.92);box-shadow:0 4px 12px rgba(120,60,110,.14);font-size:14px;text-align:center;text-wrap:balance;pointer-events:auto}
.dock{display:flex;align-items:flex-end;justify-content:center;gap:14px;pointer-events:auto}
.big{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;width:88px;height:88px;border:0;border-radius:50%;color:#fff;font-weight:900;font-size:15px;line-height:1.1;
  background:radial-gradient(circle at 35% 30%,#ffa3c1,var(--pink) 60%,var(--pink-deep));box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.4),0 10px 24px rgba(226,80,126,.45);transition:transform .12s;animation:breathe 2.4s ease-in-out infinite}
.big .ico{font-size:30px;line-height:1}
.big:active:not(:disabled){transform:scale(.94)}
.big:disabled{filter:grayscale(.6) opacity(.6);cursor:default}
.big.mint{background:radial-gradient(circle at 35% 30%,#a6f0d6,var(--mint) 60%,#3cb990);box-shadow:inset 0 -6px 0 rgba(0,0,0,.12),inset 0 3px 0 rgba(255,255,255,.4),0 10px 24px rgba(60,185,144,.45)}
.big.lemon{color:var(--ink);background:radial-gradient(circle at 35% 30%,#fff1a8,var(--lemon) 60%,#f2b628);box-shadow:inset 0 -6px 0 rgba(0,0,0,.1),inset 0 3px 0 rgba(255,255,255,.5),0 10px 24px rgba(242,182,40,.45)}
@keyframes breathe{0%,100%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.4),0 10px 24px rgba(226,80,126,.45)}50%{box-shadow:inset 0 -6px 0 rgba(0,0,0,.14),inset 0 3px 0 rgba(255,255,255,.4),0 10px 34px rgba(226,80,126,.7)}}
.alt{display:flex;flex-direction:column;align-items:center;gap:8px}
/* 道具栏和道具店 */
.hand{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.item{display:flex;align-items:center;gap:6px;padding:6px 12px 6px 8px;border:0;border-radius:999px;background:rgba(255,255,255,.9);box-shadow:0 4px 12px rgba(120,60,110,.14);font-weight:700;font-size:13px;color:var(--ink-soft);transition:transform .12s}
.item .ico{font-size:20px;line-height:1}
.item.ok{color:var(--ink);background:#fff;box-shadow:0 0 0 2.5px var(--lemon),0 6px 16px rgba(242,182,40,.4);animation:breathe2 2s ease-in-out infinite}
.item:active{transform:scale(.95)}
@keyframes breathe2{0%,100%{box-shadow:0 0 0 2.5px var(--lemon),0 6px 16px rgba(242,182,40,.4)}50%{box-shadow:0 0 0 3.5px var(--lemon),0 6px 22px rgba(242,182,40,.65)}}
.shop{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.shop li{display:grid;grid-template-columns:36px minmax(0,1fr) auto;align-items:center;gap:10px;padding:8px 10px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.shop .ico{font-size:26px;text-align:center;line-height:1}
.shop .nm{font-weight:700}
.shop .lv{font-size:12px;color:var(--ink-soft);line-height:1.35}
.pips{display:flex;gap:6px;justify-content:center}
.pip{width:40px;height:40px;border:0;border-radius:12px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-family:var(--font-num);font-weight:800;font-size:18px;color:var(--ink)}
.pip.on{background:var(--lemon);box-shadow:inset 0 -3px 0 rgba(0,0,0,.08)}
/* 证券所、银行、身家 */
.tip{margin:0;padding:8px 12px;border-radius:12px;background:#fff3d6;font-size:13px;font-weight:700;text-align:center}
.stocks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.stocks li{border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);overflow:hidden}
.stocks li.sel{box-shadow:inset 0 0 0 2.5px var(--mint)}
.row-btn{display:grid;grid-template-columns:minmax(0,1fr) 84px auto;align-items:center;gap:8px;width:100%;padding:8px 10px;border:0;background:transparent;text-align:left}
.row-btn .nm{display:flex;flex-direction:column;min-width:0}
.row-btn .nm b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-btn .nm small{font-size:11px;color:var(--ink-soft)}
.row-btn .pr{display:flex;flex-direction:column;align-items:flex-end;font-family:var(--font-num)}
.row-btn .pr b{font-size:17px;font-weight:800}
.row-btn .pr small{font-size:12px;font-weight:700;color:var(--ink-soft)}
.row-btn .pr small.up{color:#3cb990}
.row-btn .pr small.down{color:var(--pink-deep)}
.spark{width:84px;height:26px;display:block}
.hint{margin:0;padding:0 12px 8px;font-size:12.5px;font-weight:700;color:#b06a00}
.trade{display:flex;flex-direction:column;gap:8px;padding:4px 10px 10px;border-top:2px dashed var(--line)}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px}
.stepper b{min-width:44px;text-align:center;font-family:var(--font-num);font-size:20px}
.stepper .btn{padding:6px 10px}
.bank-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.bank-row .lb{width:3em;font-weight:700;color:var(--ink-soft)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px;padding:10px 12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-size:13px}
.sum div{display:flex;justify-content:space-between}
.sum b{font-family:var(--font-num)}
.sum .tot{grid-column:1/-1;border-top:2px dashed var(--line);padding-top:4px;font-weight:700}
.sum .tot b{font-size:16px;color:var(--pink-deep)}
.card-head .big-ico{font-size:44px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.15))}
.waiting{padding:10px 18px;border-radius:999px;background:rgba(255,255,255,.85);font-size:14px;color:var(--ink-soft);box-shadow:0 4px 12px rgba(120,60,110,.12)}
.side-btns{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));right:12px;z-index:6;display:flex;flex-direction:column;gap:8px}

/* 弹出的卡片 */
.modal{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(80,40,90,.18)}
.modal.clear{background:transparent;pointer-events:none}
.modal.clear .deck-card{pointer-events:auto}
.card{width:min(350px,100%);max-height:calc(100% - 20px);overflow:auto;border-radius:26px;background:var(--paper);box-shadow:var(--shadow);animation:pop .32s cubic-bezier(.2,.9,.3,1.25)}
.card-head{display:flex;align-items:center;gap:10px;padding:16px 18px 14px;background:var(--g,var(--grape));color:#fff;position:relative;overflow:hidden}
.card-head::before{content:"";position:absolute;inset:auto -30% -70% -30%;height:120%;background:radial-gradient(closest-side,rgba(255,255,255,.28),transparent 70%);pointer-events:none}
.card-head .tx{flex:1 1 auto;min-width:0;position:relative}
.card-head h3{margin:0;font-family:var(--font-title);font-weight:400;font-size:32px;letter-spacing:.1em;text-shadow:0 2px 0 rgba(0,0,0,.12)}
.card-head p{margin:0;font-size:13px;font-weight:700;opacity:.92}
.card-head .pic{flex:none;width:96px;height:96px;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.18));position:relative;animation:bob 3s ease-in-out infinite}
.card-head .pic-av{flex:none;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.35);overflow:hidden;display:grid;place-items:center}
.card-head .pic-av img{width:118%;height:118%;object-fit:contain;transform:translateY(6%)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.card-body{padding:14px 18px 18px;display:flex;flex-direction:column;gap:12px}
.blurb{margin:0;font-size:13.5px;color:var(--ink-soft);text-align:center;text-wrap:balance}
.price{display:flex;align-items:baseline;justify-content:center;gap:6px;font-family:var(--font-num);font-weight:800;font-size:34px;line-height:1}
.price small{font-family:var(--font-body);font-size:13px;font-weight:700;color:var(--ink-soft)}
.price s{font-size:18px;color:var(--ink-soft)}
.rent{width:100%;border-collapse:collapse;font-size:14px}
.rent td{padding:4px 0;border-bottom:1px dashed var(--line)}
.rent td:last-child{text-align:right;font-family:var(--font-num);font-weight:700}
.rent tr.now td{color:var(--pink-deep);font-weight:800}
.deck-card{width:min(300px,100%);border-radius:24px;background:var(--paper);box-shadow:var(--shadow);overflow:hidden;animation:flip .55s cubic-bezier(.2,.9,.3,1.1)}
.deck-card .card-head{flex-direction:column;gap:2px;padding:22px 18px 18px;text-align:center}
.deck-card .big-ico{font-size:44px;line-height:1}
.deck-card .text{padding:18px 20px 22px;font-size:18px;font-weight:700;text-align:center;line-height:1.5;text-wrap:balance}
.rank{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.rank li{display:grid;grid-template-columns:24px 38px minmax(0,1fr) auto;align-items:center;gap:8px;padding:7px 10px;border-radius:16px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.rank .no{font-family:var(--font-num);font-weight:800;font-size:20px;color:var(--pink);text-align:center}
.rank .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:700}
.rank .w{font-family:var(--font-num);font-weight:800}
.mine{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mine li{display:grid;grid-template-columns:8px 44px minmax(0,1fr) auto;align-items:center;gap:8px;padding:6px 10px 6px 8px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line)}
.mine .dot{width:8px;height:30px;border-radius:5px;background:var(--g)}
.mine .thumb{width:44px;height:44px;object-fit:contain}
.mine .nm{font-weight:700}
.mine .lv{font-size:12px;color:var(--ink-soft)}
.rules{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px;font-size:14px}
.switches{display:flex;gap:8px;justify-content:center}

.floats{position:fixed;inset:0;z-index:15;pointer-events:none;overflow:hidden}
.float{position:absolute;transform:translate(-50%,-50%);font-family:var(--font-num);font-weight:800;font-size:22px;color:#fff;padding:0 10px;border-radius:999px;animation:floatUp 1.6s ease forwards;white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.15)}
.float.up{background:#3cb990}
.float.down{background:var(--pink-deep)}
.toast{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top,0px));z-index:30;max-width:calc(100% - 32px);transform:translate(-50%,-8px);opacity:0;pointer-events:none;
  padding:9px 18px;border-radius:999px;background:var(--ink);color:#fff;font-weight:700;font-size:14px;text-align:center;box-shadow:var(--shadow);transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.banner{position:fixed;left:50%;top:calc(110px + env(safe-area-inset-top,0px));z-index:6;transform:translateX(-50%);padding:7px 16px;border-radius:999px;background:var(--pink-deep);color:#fff;font-weight:700;font-size:13px;white-space:nowrap}

@keyframes pop{from{transform:scale(.88) translateY(10px);opacity:0}}
@keyframes flip{from{transform:perspective(600px) rotateY(80deg) scale(.9);opacity:0}}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.7)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.1)}25%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-180%)}}
@media (max-width:380px){.logo{font-size:44px}.pc .cash{font-size:13px}.big{width:80px;height:80px}.card-head .pic{width:80px;height:80px}}
@media (prefers-reduced-motion:reduce){.panel,.card,.deck-card,.float,.big,.card-head .pic,#loading .dice{animation:none}}
</style>

<div id="stage"></div>
<div id="loading"><div class="inner"><div class="dice">🎲</div><div>小岛正在搭…</div></div></div>

<!-- 首页 -->
<section class="panel-wrap" id="home" hidden>
  <div class="panel">
    <button class="chip-btn corner-btn" id="btnSoundHome" type="button" aria-label="声音"><span>🔊</span></button>
    <h1 class="logo">环游大亨</h1>
    <p class="tagline">掷骰子环游中国，买下城市、盖起高楼，让对手交过路费</p>
    <div class="field"><label for="nameIn">你的名字</label><input id="nameIn" maxlength="10" autocomplete="nickname"></div>
    <div class="stack">
      <button class="btn" id="btnCreate" type="button">开个房间，叫朋友来</button>
      <button class="btn mint" id="btnSolo" type="button">和电脑玩</button>
    </div>
    <p class="note" id="previewNote" hidden>这是预览版，只能和电脑玩；联机要用正式网址打开。</p>
    <div id="joinBox">
      <div class="sep"></div>
      <div class="field"><label for="codeIn">朋友给了房间号？</label>
        <div class="row"><input id="codeIn" maxlength="4" placeholder="四个字母" autocapitalize="characters" autocomplete="off" style="flex:2 1 8em;padding:11px 14px;border:0;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 2px var(--line);font-size:16px"><button class="btn ghost" id="btnJoin" type="button" style="flex:1 1 5em">进房间</button></div>
      </div>
      <p class="err" id="homeErr"></p>
    </div>
  </div>
</section>

<!-- 进房间中 -->
<section class="panel-wrap" id="waiting" hidden>
  <div class="panel">
    <h2 id="waitTitle">正在进房间…</h2>
    <p class="note" id="waitText">连上以后会自动进去。</p>
    <div class="row" style="margin-top:14px"><button class="btn ghost" id="btnRetry" type="button">再试一次</button><button class="btn ghost" id="btnHome2" type="button">回首页</button></div>
  </div>
</section>

<!-- 大厅 -->
<section class="panel-wrap" id="lobby" hidden>
  <div class="panel">
    <h2 id="lobbyTitle">选个角色</h2>
    <span class="room-tag" id="lobbyRoom"></span>
    <div class="chars" id="chars"></div>
    <ul class="seats" id="seats"></ul>
    <div class="field" id="roundsField"><label for="roundsSel">玩多少圈</label>
      <select id="roundsSel"><option value="15">15 圈（大约 20 分钟）</option><option value="20">20 圈（大约半小时）</option><option value="30">30 圈（大约 45 分钟）</option><option value="0">不限，玩到只剩一个人</option></select>
    </div>
    <div class="share" id="shareBox">
      <span style="font-size:13px;font-weight:700">把链接发给朋友，打开就能上车</span>
      <code id="shareLink"></code>
      <button class="btn small" id="btnCopy" type="button">复制链接</button>
    </div>
    <div class="stack" id="lobbyActs"></div>
    <p class="note" id="lobbyNote"></p>
    <div class="row" style="margin-top:10px"><button class="btn ghost small" id="btnLeave" type="button">退出房间</button></div>
  </div>
</section>

<!-- 对局 -->
<div id="hud" hidden>
  <div class="hud-top">
    <div class="players" id="players"></div>
    <div class="turn-pill"><span class="who" id="turnWho"></span><span class="rd" id="roundLbl"></span></div>
    <div class="dice-pill" id="dice"></div>
    <div class="event" id="event"></div>
  </div>
  <div class="banner" id="banner" hidden></div>
  <div class="side-btns">
    <button class="chip-btn" id="btnMenu" type="button" aria-label="菜单"><span style="font-size:20px;color:var(--ink)">☰</span></button>
    <button class="chip-btn" id="btnSound" type="button" aria-label="声音"><span style="font-size:20px">🔊</span></button>
    <button class="chip-btn" id="btnLog" type="button" aria-label="回顾"><span style="font-size:20px">📜</span></button>
    <button class="chip-btn" id="btnStock" type="button" aria-label="炒股"><span style="font-size:20px">📈</span></button>
  </div>
  <div class="hud-bottom">
    <div class="msg" id="msg" hidden></div>
    <div class="hand" id="hand" hidden></div>
    <div class="dock">
      <button class="chip-btn" id="btnMine" type="button" aria-label="我的城市">🏠<span>城市</span></button>
      <div class="alt" id="acts"></div>
      <button class="chip-btn" id="btnView" type="button" aria-label="看全图">🔭<span>全图</span></button>
    </div>
  </div>
</div>
<div class="floats" id="floats"></div>
<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
